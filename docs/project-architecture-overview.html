  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;

* {
  box-sizing: border-box;
}

html &gt; body {
  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--viz-font-weight-medium);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);

    #ics-architecture-visual .node.data { background: color-mix(in srgb, var(--viz-series-3) 10%, var(--card)); }

    #ics-architecture-visual .module-item span { color: var(--muted-foreground); }
    #ics-architecture-visual .flow {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 28px 18px;
      counter-reset: flow;

    #ics-architecture-visual .flow-step {

      align-content: start;
      gap: 5px;
      counter-increment: flow;

    #ics-architecture-visual .flow-step::before {

    #ics-architecture-visual .priority-fill { height: 100%; background: var(--viz-series-1); }
    #ics-architecture-visual .w100 { width: 100%; }
    #ics-architecture-visual .w82 { width: 82%; }
    #ics-architecture-visual .w68 { width: 68%; }
    #ics-architecture-visual .w52 { width: 52%; }
    #ics-architecture-visual .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; color: var(--muted-foreground); }
    #ics-architecture-visual .legend span { display: inline-flex; align-items: center; gap: 6px; }
    #ics-architecture-visual .swatch { width: 10px; height: 10px; border-radius: 2px; background: var(--viz-series-1); }

    @media (max-width: 820px) {
      #ics-architecture-visual { padding: 12px; }

      #ics-architecture-visual .flow-step:nth-child(4n)::after { content: &quot;→&quot;; }

      #ics-architecture-visual .data-map { grid-template-columns: 1fr; }

      &lt;div class=&quot;module-group&quot;&gt;&lt;h3&gt;用户与会话&lt;/h3&gt;&lt;div class=&quot;module-list&quot;&gt;&lt;div class=&quot;module-item&quot;&gt;&lt;strong&gt;state_service.py&lt;/strong&gt;&lt;span&gt;进程内即时状态&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;module-item&quot;&gt;&lt;strong&gt;user_profile_service.py&lt;/strong&gt;&lt;span&gt;画像、记忆与画像事件&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;module-item&quot;&gt;&lt;strong&gt;conversation_service.py&lt;/strong&gt;&lt;span&gt;客服会话与消息&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;module-item&quot;&gt;&lt;strong&gt;conversation_event_service.py&lt;/strong&gt;&lt;span&gt;SSE 进程内事件 Broker&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;module-group&quot;&gt;&lt;h3&gt;知识与商品&lt;/h3&gt;&lt;div class=&quot;module-list&quot;&gt;&lt;div class=&quot;module-item&quot;&gt;&lt;strong&gt;knowledge_service.py&lt;/strong&gt;&lt;span&gt;文档解析与切片&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;module-item&quot;&gt;&lt;strong&gt;embedding_service.py&lt;/strong&gt;&lt;span&gt;文本向量化&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;module-item&quot;&gt;&lt;strong&gt;qdrant_service.py&lt;/strong&gt;&lt;span&gt;向量检索&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;module-item&quot;&gt;&lt;strong&gt;rerank_service.py&lt;/strong&gt;&lt;span&gt;候选文档重排&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;module-item&quot;&gt;&lt;strong&gt;orchid_products/&lt;/strong&gt;&lt;span&gt;兰花商品与知识模型&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;module-group&quot;&gt;&lt;h3&gt;运营与基础设施&lt;/h3&gt;&lt;div class=&quot;module-list&quot;&gt;&lt;div class=&quot;module-item&quot;&gt;&lt;strong&gt;message_risk_control_service.py&lt;/strong&gt;&lt;span&gt;Eyun 去重、合并、限速、发送队列&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;module-item&quot;&gt;&lt;strong&gt;chat_log_service.py&lt;/strong&gt;&lt;span&gt;链路日志与统计&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;module-item&quot;&gt;&lt;strong&gt;admin-web/workbench&lt;/strong&gt;&lt;span&gt;会话监督与人工接管&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;module-item&quot;&gt;&lt;strong&gt;evaluation/&lt;/strong&gt;&lt;span&gt;端到端业务评测&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;chat-flow&quot; class=&quot;tab-panel&quot; aria-label=&quot;聊天信息流&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;&lt;h2&gt;统一聊天主链路&lt;/h2&gt;&lt;p&gt;当前单轮请求包含多次策略覆盖和多处状态写入。&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;flow&quot; role=&quot;list&quot; aria-label=&quot;聊天处理的十二个步骤&quot;&gt;
      &lt;div class=&quot;flow-step&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;渠道标准化&lt;/strong&gt;&lt;span&gt;生成 trace、session、tenant、metadata&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;flow-step&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;读取状态&lt;/strong&gt;&lt;span&gt;即时状态、用户画像、历史记忆&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;flow-step&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;规则保护&lt;/strong&gt;&lt;span&gt;高风险、人工请求、固定规则&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;flow-step&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;意图识别&lt;/strong&gt;&lt;span&gt;意图样本检索 + 规则/LLM 分类&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;flow-step&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;基础 Policy&lt;/strong&gt;&lt;span&gt;template / rag / human / clarify&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;flow-step&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;标签与阶段&lt;/strong&gt;&lt;span&gt;客户标签、销售阶段、实体槽位&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;flow-step&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;标签 Policy&lt;/strong&gt;&lt;span&gt;客户等级、知识库、Prompt 约束&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;flow-step&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;业务上下文覆盖&lt;/strong&gt;&lt;span&gt;商品、订单、活动等结构化事实&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;flow-step&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;Reply Graph&lt;/strong&gt;&lt;span&gt;话术、模板、RAG、人工分支&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;flow-step&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;销售动作&lt;/strong&gt;&lt;span&gt;追问、推荐、推进、下一步&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;flow-step&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;状态写回&lt;/strong&gt;&lt;span&gt;状态、记忆、画像、会话表&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;flow-step&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;日志与响应&lt;/strong&gt;&lt;span&gt;FinalReply、阶段耗时、APIResponse&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;channels&quot; class=&quot;tab-panel&quot; aria-label=&quot;渠道与工作台信息流&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;&lt;h2&gt;三条渠道信息流&lt;/h2&gt;&lt;p&gt;Chat API 和公众号同步调用主链路；Eyun 使用持久化队列、延迟和限速发送。&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;channel-flows&quot;&gt;
      &lt;div class=&quot;channel-flow&quot;&gt;&lt;h3&gt;Chat API&lt;/h3&gt;&lt;div class=&quot;lane&quot;&gt;&lt;div class=&quot;lane-item&quot;&gt;POST /api/v1/chat&lt;/div&gt;&lt;div class=&quot;lane-item&quot;&gt;统一编排&lt;/div&gt;&lt;div class=&quot;lane-item&quot;&gt;JSON Reply&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;channel-flow&quot;&gt;&lt;h3&gt;微信公众号&lt;/h3&gt;&lt;div class=&quot;lane&quot;&gt;&lt;div class=&quot;lane-item&quot;&gt;签名校验&lt;/div&gt;&lt;div class=&quot;lane-item&quot;&gt;XML 解析与去重&lt;/div&gt;&lt;div class=&quot;lane-item&quot;&gt;统一编排&lt;/div&gt;&lt;div class=&quot;lane-item&quot;&gt;XML 回复&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;channel-flow&quot;&gt;&lt;h3&gt;Eyun / 企业微信&lt;/h3&gt;&lt;div class=&quot;lane&quot;&gt;&lt;div class=&quot;lane-item&quot;&gt;回调立即 ACK&lt;/div&gt;&lt;div class=&quot;lane-item&quot;&gt;记录客户消息&lt;/div&gt;&lt;div class=&quot;lane-item&quot;&gt;SQLite 合并队列&lt;/div&gt;&lt;div class=&quot;lane-item&quot;&gt;后台 Worker&lt;/div&gt;&lt;div class=&quot;lane-item&quot;&gt;统一编排&lt;/div&gt;&lt;div class=&quot;lane-item&quot;&gt;限速 Outbox&lt;/div&gt;&lt;div class=&quot;lane-item&quot;&gt;Eyun 发送&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;channel-flow&quot;&gt;&lt;h3&gt;人工工作台&lt;/h3&gt;&lt;div class=&quot;lane&quot;&gt;&lt;div class=&quot;lane-item&quot;&gt;REST 拉取会话&lt;/div&gt;&lt;div class=&quot;lane-item&quot;&gt;SSE 会话变化&lt;/div&gt;&lt;div class=&quot;lane-item&quot;&gt;认领 / 回复&lt;/div&gt;&lt;div class=&quot;lane-item&quot;&gt;接管 / 释放 AI&lt;/div&gt;&lt;div class=&quot;lane-item&quot;&gt;Eyun 人工发送&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;data&quot; class=&quot;tab-panel&quot; aria-label=&quot;数据与外部依赖&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;&lt;h2&gt;数据边界与外部依赖&lt;/h2&gt;&lt;p&gt;当前生产部署以单 API 实例和本地持久化卷为中心。&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;data-map&quot;&gt;
      &lt;div class=&quot;data-column&quot;&gt;&lt;h3&gt;业务写入&lt;/h3&gt;&lt;div class=&quot;node&quot;&gt;&lt;strong&gt;聊天主链路&lt;/strong&gt;&lt;span&gt;状态、记忆、会话、日志&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;node&quot;&gt;&lt;strong&gt;知识入库&lt;/strong&gt;&lt;span&gt;上传、解析、切片、向量化&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;node&quot;&gt;&lt;strong&gt;Eyun Worker&lt;/strong&gt;&lt;span&gt;Inbound Batch / Outbox / Rate&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;node&quot;&gt;&lt;strong&gt;运营后台&lt;/strong&gt;&lt;span&gt;话术、用户画像、人工状态&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;data-column&quot;&gt;&lt;h3&gt;存储&lt;/h3&gt;&lt;div class=&quot;node data&quot;&gt;&lt;strong&gt;rag.db / SQLite&lt;/strong&gt;&lt;span&gt;会话、消息、画像、记忆、话术、商品、风险控制队列&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;node data&quot;&gt;&lt;strong&gt;chat_logs.db / SQLite&lt;/strong&gt;&lt;span&gt;聊天链路、意图、路由、耗时、异常&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;node data&quot;&gt;&lt;strong&gt;Qdrant&lt;/strong&gt;&lt;span&gt;知识块、意图样本与向量检索&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;node data&quot;&gt;&lt;strong&gt;上传目录&lt;/strong&gt;&lt;span&gt;TXT / Markdown / PDF 原始文件&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;node data&quot;&gt;&lt;strong&gt;进程内状态&lt;/strong&gt;&lt;span&gt;UserState、SSE Broker、缓存、后台任务&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;data-column&quot;&gt;&lt;h3&gt;外部服务&lt;/h3&gt;&lt;div class=&quot;node external&quot;&gt;&lt;strong&gt;LLM Provider&lt;/strong&gt;&lt;span&gt;通义、豆包、DeepSeek、OpenAI 兼容接口&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;node external&quot;&gt;&lt;strong&gt;Embedding&lt;/strong&gt;&lt;span&gt;BGE-M3 本地模型或远程 API&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;node external&quot;&gt;&lt;strong&gt;Qdrant Cloud&lt;/strong&gt;&lt;span&gt;生产向量数据库&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;node external&quot;&gt;&lt;strong&gt;Eyun API&lt;/strong&gt;&lt;span&gt;联系人快照、媒体解析、消息发送&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;risks&quot; class=&quot;tab-panel&quot; aria-label=&quot;架构痛点与治理优先级&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;&lt;h2&gt;架构痛点排序&lt;/h2&gt;&lt;p&gt;第一优先级是收敛决策链路，其余问题按生产扩展风险依次治理。&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;risk-stack&quot;&gt;
      &lt;div class=&quot;risk&quot;&gt;&lt;div class=&quot;risk-rank&quot;&gt;P0 · 核心&lt;/div&gt;&lt;div class=&quot;risk-main&quot;&gt;&lt;strong&gt;回复决策没有唯一事实源&lt;/strong&gt;&lt;span&gt;基础 Policy、标签 Policy、业务上下文和回复图可连续覆盖路由&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;risk-detail&quot;&gt;直接表现为内部业务字段直出、误转人工、多轮销售阶段丢失；修改一个策略需要理解多个覆盖层。&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;risk&quot;&gt;&lt;div class=&quot;risk-rank&quot;&gt;P1 · 产品&lt;/div&gt;&lt;div class=&quot;risk-main&quot;&gt;&lt;strong&gt;事实与表达没有解耦&lt;/strong&gt;&lt;span&gt;tool_state 可以直接拼成客户回复&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;risk-detail&quot;&gt;订单、支付、活动等内部键值可能暴露给客户，业务事实也无法按场景转成可执行的自然语言。&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;risk&quot;&gt;&lt;div class=&quot;risk-rank&quot;&gt;P1 · 运行&lt;/div&gt;&lt;div class=&quot;risk-main&quot;&gt;&lt;strong&gt;单实例状态模型&lt;/strong&gt;&lt;span&gt;进程内 UserState、SSE Broker、Worker&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;risk-detail&quot;&gt;水平扩容后会出现状态不一致、事件不可见和多个 Worker 竞争；当前 Docker 方案事实上依赖单 API 实例。&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;risk&quot;&gt;&lt;div class=&quot;risk-rank&quot;&gt;P1 · 性能&lt;/div&gt;&lt;div class=&quot;risk-main&quot;&gt;&lt;strong&gt;异步接口内同步数据库 I/O&lt;/strong&gt;&lt;span&gt;async service 直接调用同步 SQLAlchemy Session&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;risk-detail&quot;&gt;并发升高后会阻塞事件循环，与长耗时模型调用叠加，扩大尾延迟和超时影响。&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;risk&quot;&gt;&lt;div class=&quot;risk-rank&quot;&gt;P2 · 维护&lt;/div&gt;&lt;div class=&quot;risk-main&quot;&gt;&lt;strong&gt;双回复实现与运行时建表&lt;/strong&gt;&lt;span&gt;LangGraph + legacy _build_reply；create_all + ALTER TABLE&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;risk-detail&quot;&gt;两套回复分支容易漂移；数据库缺少正式版本迁移和可审计回滚路径。&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;section-head&quot;&gt;&lt;h3&gt;建议治理顺序&lt;/h3&gt;&lt;/div&gt;
    &lt;div class=&quot;priority&quot; aria-label=&quot;治理优先级&quot;&gt;
      &lt;div class=&quot;priority-row&quot;&gt;&lt;span&gt;统一 ReplyPlan&lt;/span&gt;&lt;div class=&quot;priority-bar&quot;&gt;&lt;div class=&quot;priority-fill w100&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;priority-row&quot;&gt;&lt;span&gt;事实表达层&lt;/span&gt;&lt;div class=&quot;priority-bar&quot;&gt;&lt;div class=&quot;priority-fill w82&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;priority-row&quot;&gt;&lt;span&gt;单一执行图&lt;/span&gt;&lt;div class=&quot;priority-bar&quot;&gt;&lt;div class=&quot;priority-fill w68&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;priority-row&quot;&gt;&lt;span&gt;数据基础设施&lt;/span&gt;&lt;div class=&quot;priority-bar&quot;&gt;&lt;div class=&quot;priority-fill w52&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;ics-architecture-visual&#x27;);
      if (!root) return;
      const buttons = Array.from(root.querySelectorAll(&#x27;[data-tab]&#x27;));
      const panels = Array.from(root.querySelectorAll(&#x27;.tab-panel&#x27;));
      buttons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const target = button.getAttribute(&#x27;data-tab&#x27;);
          buttons.forEach((item) =&gt; {
            const active = item === button;
            item.setAttribute(&#x27;aria-pressed&#x27;, String(active));
            item.classList.toggle(&#x27;btn-primary&#x27;, active);
          });
          panels.forEach((panel) =&gt; panel.classList.toggle(&#x27;is-active&#x27;, panel.id === target));
        });
      });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
