    #ics-showcase {

    #ics-showcase .hero-meta { display: flex; gap: 20px; color: var(--muted-foreground); }

    #ics-showcase .hero-meta strong { color: var(--foreground); font-weight: 500; }
    #ics-showcase .tabs { margin: 18px 0 24px; }
    #ics-showcase .tab-panel { display: none; }
    #ics-showcase .tab-panel.is-active { display: block; }
    #ics-showcase .section-head {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: end;
      margin: 0 0 14px;
    }
    #ics-showcase .section-head p { color: var(--muted-foreground); max-width: 680px; text-align: right; }
    #ics-showcase .flow-canvas {
      padding: 18px;
      background: color-mix(in srgb, var(--card) 72%, transparent);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    #ics-showcase .canvas-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
      color: var(--muted-foreground);

    #ics-showcase .canvas-label strong { color: var(--foreground); font-weight: 500; }
    #ics-showcase .architecture-stack { display: grid; gap: 9px; }

      grid-template-columns: 116px minmax(0, 1fr);
      gap: 14px;
      align-items: stretch;
    }
    #ics-showcase .layer-name {
      display: flex;
      align-items: center;
      color: var(--muted-foreground);
      border-right: 1px solid var(--border);
      padding-right: 14px;
    }
    #ics-showcase .layer-nodes {
      display: grid;
      grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
      gap: 9px;
    }
    #ics-showcase .node {
      min-width: 0;
      min-height: 70px;
      padding: 12px 13px;
      display: grid;
      align-content: center;
      gap: 4px;
      background: color-mix(in srgb, var(--viz-series-1) 9%, var(--background));
      border: 1px solid color-mix(in srgb, var(--viz-series-1) 24%, var(--border));
      border-radius: 9px;
      overflow-wrap: anywhere;
    }
    #ics-showcase .node strong { font-weight: 500; }
    #ics-showcase .node span { color: var(--muted-foreground); }
    #ics-showcase .node.channel { background: color-mix(in srgb, var(--viz-series-2) 9%, var(--background)); border-color: color-mix(in srgb, var(--viz-series-2) 24%, var(--border)); }
    #ics-showcase .node.data { background: color-mix(in srgb, var(--viz-series-3) 9%, var(--background)); border-color: color-mix(in srgb, var(--viz-series-3) 24%, var(--border)); }
    #ics-showcase .node.external { background: color-mix(in srgb, var(--viz-series-4) 9%, var(--background)); border-color: color-mix(in srgb, var(--viz-series-4) 24%, var(--border)); }
    #ics-showcase .layer-connector {
      display: grid;
      grid-template-columns: 116px minmax(0, 1fr);
      gap: 14px;
      min-height: 18px;

    #ics-showcase .layer-connector span:last-child { text-align: center; color: var(--muted-foreground); }
    #ics-showcase .summary-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;

    #ics-showcase .flow-grid { display: grid; gap: 14px; }
    #ics-showcase .flow-track {

      gap: 0;

      min-height: 92px;
      padding: 12px;

      gap: 5px;

    #ics-showcase .flow-node.green { background: color-mix(in srgb, var(--viz-series-3) 8%, var(--background)); border-color: color-mix(in srgb, var(--viz-series-3) 22%, var(--border)); }
    #ics-showcase .flow-node.pink { background: color-mix(in srgb, var(--viz-series-4) 8%, var(--background)); border-color: color-mix(in srgb, var(--viz-series-4) 22%, var(--border)); }
    #ics-showcase .flow-node.channel { background: color-mix(in srgb, var(--viz-series-2) 8%, var(--background)); border-color: color-mix(in srgb, var(--viz-series-2) 22%, var(--border)); }
    #ics-showcase .connector {

      display: grid;
      place-items: center;
      color: var(--muted-foreground);
    }
    #ics-showcase .stage-row {
      display: grid;
      grid-template-columns: 94px minmax(0, 1fr);
      gap: 12px;
      align-items: stretch;

    #ics-showcase .stage-label { display: grid; align-content: center; color: var(--muted-foreground); }
    #ics-showcase .split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    #ics-showcase .fanout {

    #ics-showcase .fanout-targets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    #ics-showcase .channel-lanes { display: grid; gap: 12px; }
    #ics-showcase .channel-lane {
      display: grid;
      grid-template-columns: 128px minmax(0, 1fr);
      gap: 12px;
      align-items: stretch;
    }
    #ics-showcase .channel-name { display: grid; align-content: center; color: var(--muted-foreground); }
    #ics-showcase .data-cycle {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      align-items: stretch;

    #ics-showcase .cycle-step {
      min-width: 0;
      position: relative;
      padding: 13px;
      min-height: 92px;
      display: grid;
      align-content: center;
      gap: 4px;

      overflow-wrap: anywhere;

    #ics-showcase .cycle-step span { color: var(--muted-foreground); }
    #ics-showcase .relation-legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; color: var(--muted-foreground); }
    #ics-showcase .relation-legend span { display: inline-flex; gap: 7px; align-items: center; }
    #ics-showcase .swatch { width: 12px; height: 4px; border-radius: 999px; background: var(--viz-series-1); }
    #ics-showcase .swatch.s2 { background: var(--viz-series-2); }
    #ics-showcase .swatch.s3 { background: var(--viz-series-3); }
    #ics-showcase .swatch.s4 { background: var(--viz-series-4); }
    @media (max-width: 1050px) {
      #ics-showcase { padding: 18px; }
      #ics-showcase .hero { grid-template-columns: 1fr; }

    @media (max-width: 720px) {

      #ics-showcase .data-cycle { grid-template-columns: 1fr; }
    }

      &lt;div class=&quot;flow-canvas&quot;&gt;
        &lt;div class=&quot;canvas-label&quot;&gt;&lt;strong&gt;阶段 A · 请求理解&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;输入 → 状态 → 意图&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;stage-row&quot;&gt;&lt;div class=&quot;stage-label&quot;&gt;理解阶段&lt;/div&gt;&lt;div class=&quot;flow-track&quot; style=&quot;--steps:7&quot;&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;ChatRequest&lt;/strong&gt;&lt;span&gt;渠道原始输入&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;normalize&lt;/strong&gt;&lt;span&gt;trace / session / tenant&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;User State&lt;/strong&gt;&lt;span&gt;画像与会话记忆&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;Rule Guard&lt;/strong&gt;&lt;span&gt;固定规则与风险&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;stage-row&quot; style=&quot;margin-top:9px&quot;&gt;&lt;div class=&quot;stage-label&quot;&gt;&lt;/div&gt;&lt;div class=&quot;flow-track&quot; style=&quot;--steps:7&quot;&gt;&lt;div class=&quot;flow-node warm&quot;&gt;&lt;strong&gt;Intent Examples&lt;/strong&gt;&lt;span&gt;相似样本检索&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node warm&quot;&gt;&lt;strong&gt;Intent Classifier&lt;/strong&gt;&lt;span&gt;规则 / LLM&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node warm&quot;&gt;&lt;strong&gt;IntentResult&lt;/strong&gt;&lt;span&gt;意图、置信度、槽位&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node warm&quot;&gt;&lt;strong&gt;Base Policy&lt;/strong&gt;&lt;span&gt;初始回复路由&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-canvas&quot;&gt;
        &lt;div class=&quot;canvas-label&quot;&gt;&lt;strong&gt;阶段 B · 策略与回复&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;标签策略 → LangGraph → FinalReply&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;stage-row&quot;&gt;&lt;div class=&quot;stage-label&quot;&gt;决策阶段&lt;/div&gt;&lt;div class=&quot;flow-track&quot; style=&quot;--steps:9&quot;&gt;&lt;div class=&quot;flow-node warm&quot;&gt;&lt;strong&gt;Tagger&lt;/strong&gt;&lt;span&gt;客户标签与实体&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node warm&quot;&gt;&lt;strong&gt;Sales Stage&lt;/strong&gt;&lt;span&gt;销售阶段判断&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node warm&quot;&gt;&lt;strong&gt;Rich Policy&lt;/strong&gt;&lt;span&gt;知识库与 Prompt&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node warm&quot;&gt;&lt;strong&gt;Business Context&lt;/strong&gt;&lt;span&gt;商品、订单、活动事实&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;Reply Graph&lt;/strong&gt;&lt;span&gt;回复分支执行&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;fanout&quot; style=&quot;margin-top:12px&quot;&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;Reply Graph&lt;/strong&gt;&lt;span&gt;按最终 route 分派&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fanout-arrow&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;fanout-targets&quot;&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;Talk Script&lt;/strong&gt;&lt;span&gt;确定性话术&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;Template&lt;/strong&gt;&lt;span&gt;模板与业务事实&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;RAG&lt;/strong&gt;&lt;span&gt;知识生成&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-node pink&quot;&gt;&lt;strong&gt;Human&lt;/strong&gt;&lt;span&gt;人工接管&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;Clarify&lt;/strong&gt;&lt;span&gt;信息补充&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;Chitchat&lt;/strong&gt;&lt;span&gt;闲聊响应&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-canvas&quot;&gt;
        &lt;div class=&quot;canvas-label&quot;&gt;&lt;strong&gt;阶段 C · 输出与状态回写&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;FinalReply 一次生成，多处消费&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;fanout&quot;&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;FinalReply&lt;/strong&gt;&lt;span&gt;answer / route / metadata / sources&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fanout-arrow&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;fanout-targets&quot;&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;User State&lt;/strong&gt;&lt;span&gt;阶段、标签、机会&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;Conversation Memory&lt;/strong&gt;&lt;span&gt;用户与助手记忆&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;User Profile&lt;/strong&gt;&lt;span&gt;异步画像分析&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;Conversation&lt;/strong&gt;&lt;span&gt;工作台消息流&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;Chat Log&lt;/strong&gt;&lt;span&gt;路由与耗时&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;Channel Response&lt;/strong&gt;&lt;span&gt;JSON / XML / Outbox&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;module-flow&quot; class=&quot;tab-panel&quot; aria-label=&quot;模块关系流&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;&lt;h2&gt;模块关系流&lt;/h2&gt;&lt;p&gt;按“决策流、回复流、状态流”观察服务模块之间的调用关系。&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;split-grid&quot;&gt;
      &lt;div class=&quot;flow-canvas&quot;&gt;
        &lt;div class=&quot;canvas-label&quot;&gt;&lt;strong&gt;决策模块关系&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;services/&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;flow-track&quot; style=&quot;--steps:9&quot;&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;state_service&lt;/strong&gt;&lt;span&gt;当前状态&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;intent_service&lt;/strong&gt;&lt;span&gt;意图分类&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node warm&quot;&gt;&lt;strong&gt;policy_service&lt;/strong&gt;&lt;span&gt;基础路由&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node warm&quot;&gt;&lt;strong&gt;tagger_service&lt;/strong&gt;&lt;span&gt;标签实体&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node warm&quot;&gt;&lt;strong&gt;policy_engine&lt;/strong&gt;&lt;span&gt;标签策略&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-canvas&quot;&gt;
        &lt;div class=&quot;canvas-label&quot;&gt;&lt;strong&gt;回复模块关系&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;reply graph&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;flow-track&quot; style=&quot;--steps:7&quot;&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;reply_workflow_graph&lt;/strong&gt;&lt;span&gt;route 分派&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;talk_script&lt;/strong&gt;&lt;span&gt;优先匹配&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;template / rag / handoff&lt;/strong&gt;&lt;span&gt;生成回复&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;reply_builder&lt;/strong&gt;&lt;span&gt;FinalReply&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-canvas&quot;&gt;
        &lt;div class=&quot;canvas-label&quot;&gt;&lt;strong&gt;RAG 内部信息流&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;rag_service&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;flow-track&quot; style=&quot;--steps:9&quot;&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;Context Selector&lt;/strong&gt;&lt;span&gt;历史与画像&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;Embedding&lt;/strong&gt;&lt;span&gt;查询向量&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;Qdrant Search&lt;/strong&gt;&lt;span&gt;候选知识&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;Rerank&lt;/strong&gt;&lt;span&gt;相关性排序&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;Prompt + LLM&lt;/strong&gt;&lt;span&gt;受约束生成&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-canvas&quot;&gt;
        &lt;div class=&quot;canvas-label&quot;&gt;&lt;strong&gt;状态持久化关系&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;profile / conversation / log&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;fanout&quot;&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;Chat Result&lt;/strong&gt;&lt;span&gt;一轮结果&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fanout-arrow&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;fanout-targets&quot;&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;state_service&lt;/strong&gt;&lt;span&gt;即时状态&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;user_profile_service&lt;/strong&gt;&lt;span&gt;画像与记忆&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;conversation_service&lt;/strong&gt;&lt;span&gt;客服会话&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;chat_log_service&lt;/strong&gt;&lt;span&gt;链路日志&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;event_broker&lt;/strong&gt;&lt;span&gt;SSE 事件&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;risk_control&lt;/strong&gt;&lt;span&gt;Eyun Outbox&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;relation-legend text-small&quot;&gt;&lt;span&gt;&lt;i class=&quot;swatch&quot;&gt;&lt;/i&gt;核心编排&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;swatch s2&quot;&gt;&lt;/i&gt;策略判断&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;swatch s3&quot;&gt;&lt;/i&gt;数据与回复&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;swatch s4&quot;&gt;&lt;/i&gt;外部或人工&lt;/span&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;channel-flow&quot; class=&quot;tab-panel&quot; aria-label=&quot;渠道信息流&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;&lt;h2&gt;渠道信息流&lt;/h2&gt;&lt;p&gt;四类入口最终共享聊天主链路，但消息确认、发送和人工介入方式不同。&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;flow-canvas&quot;&gt;
      &lt;div class=&quot;canvas-label&quot;&gt;&lt;strong&gt;渠道并行泳道&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;入口 → 编排 → 输出&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;channel-lanes&quot;&gt;
        &lt;div class=&quot;channel-lane&quot;&gt;&lt;div class=&quot;channel-name&quot;&gt;Chat API&lt;/div&gt;&lt;div class=&quot;flow-track&quot; style=&quot;--steps:5&quot;&gt;&lt;div class=&quot;flow-node channel&quot;&gt;&lt;strong&gt;POST /chat&lt;/strong&gt;&lt;span&gt;ChatRequest&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;handle_chat&lt;/strong&gt;&lt;span&gt;同步编排&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node channel&quot;&gt;&lt;strong&gt;JSON Response&lt;/strong&gt;&lt;span&gt;APIResponse&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;channel-lane&quot;&gt;&lt;div class=&quot;channel-name&quot;&gt;微信公众号&lt;/div&gt;&lt;div class=&quot;flow-track&quot; style=&quot;--steps:9&quot;&gt;&lt;div class=&quot;flow-node channel&quot;&gt;&lt;strong&gt;Callback&lt;/strong&gt;&lt;span&gt;签名校验&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node channel&quot;&gt;&lt;strong&gt;XML Parse&lt;/strong&gt;&lt;span&gt;文本与去重&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;handle_chat&lt;/strong&gt;&lt;span&gt;同步编排&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node channel&quot;&gt;&lt;strong&gt;XML Build&lt;/strong&gt;&lt;span&gt;公众号格式&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node channel&quot;&gt;&lt;strong&gt;WeChat&lt;/strong&gt;&lt;span&gt;客户收到回复&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;channel-lane&quot;&gt;&lt;div class=&quot;channel-name&quot;&gt;Eyun / 企业微信&lt;/div&gt;&lt;div class=&quot;flow-track&quot; style=&quot;--steps:13&quot;&gt;&lt;div class=&quot;flow-node channel&quot;&gt;&lt;strong&gt;Callback&lt;/strong&gt;&lt;span&gt;立即 ACK&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node channel&quot;&gt;&lt;strong&gt;Record&lt;/strong&gt;&lt;span&gt;客户消息&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;Inbound Batch&lt;/strong&gt;&lt;span&gt;合并与防抖&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;Worker&lt;/strong&gt;&lt;span&gt;统一编排&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;Outbox&lt;/strong&gt;&lt;span&gt;延迟与限速&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node channel&quot;&gt;&lt;strong&gt;Eyun Send API&lt;/strong&gt;&lt;span&gt;发送给客户&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node channel&quot;&gt;&lt;strong&gt;Customer&lt;/strong&gt;&lt;span&gt;企业微信会话&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;channel-lane&quot;&gt;&lt;div class=&quot;channel-name&quot;&gt;人工工作台&lt;/div&gt;&lt;div class=&quot;flow-track&quot; style=&quot;--steps:11&quot;&gt;&lt;div class=&quot;flow-node channel&quot;&gt;&lt;strong&gt;REST + SSE&lt;/strong&gt;&lt;span&gt;会话列表与变化&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node pink&quot;&gt;&lt;strong&gt;Claim&lt;/strong&gt;&lt;span&gt;人工认领&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node pink&quot;&gt;&lt;strong&gt;Reply&lt;/strong&gt;&lt;span&gt;人工回复&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node green&quot;&gt;&lt;strong&gt;Conversation DB&lt;/strong&gt;&lt;span&gt;状态与消息&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node channel&quot;&gt;&lt;strong&gt;Eyun Send&lt;/strong&gt;&lt;span&gt;发送人工消息&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;flow-node pink&quot;&gt;&lt;strong&gt;Release / Resolve&lt;/strong&gt;&lt;span&gt;恢复 AI 或结束&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;data-flow&quot; class=&quot;tab-panel&quot; aria-label=&quot;数据生命周期&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;&lt;h2&gt;数据生命周期&lt;/h2&gt;&lt;p&gt;知识、对话、用户画像和工作台状态通过不同路径进入系统并被持续消费。&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;flow-grid&quot;&gt;
      &lt;div class=&quot;flow-canvas&quot;&gt;
        &lt;div class=&quot;canvas-label&quot;&gt;&lt;strong&gt;知识入库流&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;文件 → 向量索引&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;data-cycle&quot;&gt;&lt;div class=&quot;cycle-step&quot;&gt;&lt;strong&gt;上传文件&lt;/strong&gt;&lt;span&gt;TXT / MD / PDF&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cycle-step&quot;&gt;&lt;strong&gt;解析与清洗&lt;/strong&gt;&lt;span&gt;抽取正文和元信息&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cycle-step&quot;&gt;&lt;strong&gt;文档切片&lt;/strong&gt;&lt;span&gt;fixed / adaptive&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cycle-step&quot;&gt;&lt;strong&gt;Embedding&lt;/strong&gt;&lt;span&gt;BGE 或远程 API&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cycle-step&quot;&gt;&lt;strong&gt;Qdrant&lt;/strong&gt;&lt;span&gt;知识块与过滤字段&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-canvas&quot;&gt;
        &lt;div class=&quot;canvas-label&quot;&gt;&lt;strong&gt;对话数据流&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;消息 → 画像 → 下一轮上下文&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;data-cycle&quot;&gt;&lt;div class=&quot;cycle-step&quot;&gt;&lt;strong&gt;客户消息&lt;/strong&gt;&lt;span&gt;NormalizedMessage&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cycle-step&quot;&gt;&lt;strong&gt;Conversation&lt;/strong&gt;&lt;span&gt;工作台消息记录&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cycle-step&quot;&gt;&lt;strong&gt;Memory&lt;/strong&gt;&lt;span&gt;用户 / 助手轮次&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cycle-step&quot;&gt;&lt;strong&gt;Profile Analysis&lt;/strong&gt;&lt;span&gt;标签、偏好、痛点&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cycle-step&quot;&gt;&lt;strong&gt;Context Selector&lt;/strong&gt;&lt;span&gt;进入下一轮 Prompt&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-canvas&quot;&gt;
        &lt;div class=&quot;canvas-label&quot;&gt;&lt;strong&gt;运营闭环&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;系统事件 → 人工操作 → 渠道&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;data-cycle&quot;&gt;&lt;div class=&quot;cycle-step&quot;&gt;&lt;strong&gt;Conversation Event&lt;/strong&gt;&lt;span&gt;状态变化&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cycle-step&quot;&gt;&lt;strong&gt;SSE Broker&lt;/strong&gt;&lt;span&gt;推送工作台&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cycle-step&quot;&gt;&lt;strong&gt;Operator Action&lt;/strong&gt;&lt;span&gt;认领、回复、释放&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cycle-step&quot;&gt;&lt;strong&gt;Conversation DB&lt;/strong&gt;&lt;span&gt;落盘状态&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cycle-step&quot;&gt;&lt;strong&gt;Eyun Outbox&lt;/strong&gt;&lt;span&gt;限速发送&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;ics-showcase&#x27;);
      if (!root) return;
      const buttons = Array.from(root.querySelectorAll(&#x27;[data-tab]&#x27;));
      const panels = Array.from(root.querySelectorAll(&#x27;.tab-panel&#x27;));
      buttons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const target = button.getAttribute(&#x27;data-tab&#x27;);
          buttons.forEach((item) =&gt; {
            const active = item === button;
            item.setAttribute(&#x27;aria-pressed&#x27;, String(active));
            item.classList.toggle(&#x27;btn-primary&#x27;, active);
          });
          panels.forEach((panel) =&gt; panel.classList.toggle(&#x27;is-active&#x27;, panel.id === target));
        });
      });
    })();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {

    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });

&lt;/script&gt;
