services:
  - type: web
    name: intelligent-customer-service-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_NAME
        value: intelligent_customer_service
      - key: API_AUTH_ENABLED
        value: "true"
      - key: API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:////var/data/rag.db
      - key: CHAT_LOG_ENABLED
        value: "true"
      - key: CHAT_LOG_PROVIDER
        value: sqlite
      - key: CHAT_LOG_DB_URL
        value: sqlite:////var/data/chat_logs.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: WECHAT_TOKEN
        sync: false
      - key: WECHAT_APP_ID
        sync: false
      - key: WECHAT_APP_SECRET
        sync: false
      - key: WECHAT_DEFAULT_KB_ID
        value: kb_default
      - key: EYUN_BASE_URL
        sync: false
      - key: EYUN_AUTHORIZATION
        sync: false
      - key: EYUN_WID
        sync: false
      - key: LLM_PROVIDER
        value: deepseek
      - key: LLM_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: RAG_KNOWLEDGE_ENABLED
        value: "false"
      - key: DEBUG_API_ENABLED
        value: "false"
    disk:
      name: backend-data
      mountPath: /var/data
      sizeGB: 1
