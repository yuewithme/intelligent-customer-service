# sales-agent.hzwohu.com production release
# Shared Runner: #4 hz-build-01 (tag: linux)
# Route: Runner (10.200.5.13) -> ubuntu@10.0.12.8 over the private CCN link (no jump host)
# Production moved 2026-10-25 to Lighthouse agent-apps-01 (public 124.220.107.214); the old
# CVM 43.143.83.26 is retired and must not be deployed to.

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - preflight
  - deploy
  - verify
  - inventory
  - upload

default:
  tags:
    - linux
  interruptible: true
  before_script:
    - |
      set -eu
      install -d -m 0700 "$HOME/.ssh"
      touch "$HOME/.ssh/known_hosts"
      chmod 0600 "$HOME/.ssh/known_hosts"
      grep -Fqx '10.0.12.8 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFgLcFXMGLzuZXYJ5jI2iBqFI/quwofKuxLpxm3AJk7Y' "$HOME/.ssh/known_hosts" ||
        printf '%s\n' '10.0.12.8 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFgLcFXMGLzuZXYJ5jI2iBqFI/quwofKuxLpxm3AJk7Y' >> "$HOME/.ssh/known_hosts"

variables:
  GIT_DEPTH: "20"
  PROD_HOST: "ubuntu@10.0.12.8"
  PROD_DIR: "/home/ubuntu/intelligent-customer-service"
  SSHOPT: "-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10"

preflight:production:
  stage: preflight
  timeout: 5m
  script:
    - |
      set -eu
      SSH="ssh $SSHOPT"
      $SSH "$PROD_HOST" "
        set -eu
        public_ip=\$(curl -fsS --max-time 5 http://metadata.tencentyun.com/latest/meta-data/public-ipv4 || true)
        if [ \"\$public_ip\" != '124.220.107.214' ]; then
          echo \"ERROR: VPC target identity mismatch (public IP: \${public_ip:-unavailable})\"
          exit 1
        fi
        test -d '$PROD_DIR/.git'
        cd '$PROD_DIR'
        remote_url=\$(git remote get-url origin)
        case \"\$remote_url\" in
          https://git.hzwohu.com/wohu-apps/intelligent-customer-service.git|git@git.hzwohu.com:wohu-apps/intelligent-customer-service.git|ssh://git@gitlab-ics/wohu-apps/intelligent-customer-service.git)
            ;;
          *)
            echo 'ERROR: production origin is not the GitLab main repository'
            exit 1
            ;;
        esac
        if [ -n \"\$(git status --porcelain --untracked-files=no)\" ]; then
          echo 'ERROR: production checkout contains tracked changes'
          exit 1
        fi
        test -f /etc/intelligent-customer-service/backend.env
        test -d /srv/intelligent-customer-service/data
        test -d /srv/intelligent-customer-service/cache/huggingface
        test -f deploy/auto-deploy.sh
        git fetch origin main --quiet
        target_revision=\$(git rev-parse origin/main)
        if [ \"\$target_revision\" != '$CI_COMMIT_SHA' ]; then
          echo 'ERROR: production origin/main does not match this pipeline revision'
          exit 1
        fi
        if ! git merge-base --is-ancestor HEAD origin/main; then
          echo 'ERROR: production checkout has commits outside origin/main; refusing deployment'
          git log --left-right --format='%m %h %s' --max-count=12 origin/main...HEAD
          git diff --stat origin/main HEAD
          exit 1
        fi
        sudo -n docker compose version >/dev/null
        printf 'production_host=%s target_revision=%s\\n' \"\$(hostname)\" \"\$target_revision\"
      "

deploy:production:
  stage: deploy
  needs:
    - preflight:production
  resource_group: sales-agent-production
  interruptible: false
  timeout: 45m
  environment:
    name: production
    url: https://sales-agent.hzwohu.com/workbench
  script:
    - |
      set -eu
      set +x
      if [ "${CI_DEBUG_TRACE:-false}" = 'true' ] || [ "${CI_DEBUG_SERVICES:-false}" = 'true' ]; then
        echo 'ERROR: debug logging must be disabled for credential deployment'
        exit 1
      fi
      : "${COS_SECRET_ID:?COS_SECRET_ID is unavailable}"
      : "${COS_SECRET_KEY:?COS_SECRET_KEY is unavailable}"
      SSH="ssh $SSHOPT"
      python3 -c 'import json,os,sys; json.dump({key: os.environ[key] for key in ("COS_SECRET_ID", "COS_SECRET_KEY")}, sys.stdout)' |
        $SSH "$PROD_HOST" "flock -w 1200 /tmp/intelligent-customer-service-deploy.lock sudo -n python3 -c \"\$(git -C '$PROD_DIR' show '$CI_COMMIT_SHA:deploy/update-cos-config.py')\""
      if [ -n "${DASHSCOPE_API_KEY_FILE:-}" ]; then
        set +x
        cat "$DASHSCOPE_API_KEY_FILE" | $SSH "$PROD_HOST" "cd '$PROD_DIR' && flock -w 1200 /tmp/intelligent-customer-service-deploy.lock sudo -n python3 -c \"\$(git show '$CI_COMMIT_SHA:deploy/update-model-key.py')\""
      fi
      if [ -n "${PLATFORM_SHARED_SECRET:-}" ]; then
        set +x
        printf '%s' "$PLATFORM_SHARED_SECRET" | $SSH "$PROD_HOST" "flock -w 1200 /tmp/intelligent-customer-service-deploy.lock sudo -n python3 -c \"\$(git -C '$PROD_DIR' show '$CI_COMMIT_SHA:deploy/update-platform-config.py')\""
      fi
      if [ -n "${FEISHU_HANDOFF_WEBHOOK_URL:-}" ]; then
        set +x
        printf '%s' "$FEISHU_HANDOFF_WEBHOOK_URL" | $SSH "$PROD_HOST" "flock -w 1200 /tmp/intelligent-customer-service-deploy.lock sudo -n python3 -c \"\$(git -C '$PROD_DIR' show '$CI_COMMIT_SHA:deploy/update-feishu-webhook.py')\""
      fi
      $SSH "$PROD_HOST" "cd '$PROD_DIR' && bash deploy/auto-deploy.sh --force"

verify:production:
  stage: verify
  needs:
    - deploy:production
  timeout: 5m
  environment:
    name: production
    action: verify
  script:
    - |
      set -eu
      SSH="ssh $SSHOPT"
      deployed_revision="$($SSH "$PROD_HOST" "git -C '$PROD_DIR' rev-parse HEAD")"
      if [ "$deployed_revision" != "$CI_COMMIT_SHA" ]; then
        echo "ERROR: deployed revision $deployed_revision does not match $CI_COMMIT_SHA"
        exit 1
      fi
      set +x
      if [ "${CI_DEBUG_TRACE:-false}" = 'true' ] || [ "${CI_DEBUG_SERVICES:-false}" = 'true' ]; then
        echo 'ERROR: debug logging must be disabled for credential verification'
        exit 1
      fi
      : "${COS_SECRET_ID:?COS_SECRET_ID is unavailable}"
      : "${COS_SECRET_KEY:?COS_SECRET_KEY is unavailable}"
      python3 -c 'import json,os,sys; json.dump({key: os.environ[key] for key in ("COS_SECRET_ID", "COS_SECRET_KEY")}, sys.stdout)' |
        $SSH "$PROD_HOST" "sudo -n python3 '$PROD_DIR/deploy/update-cos-config.py' --verify"
      if [ -n "${FEISHU_HANDOFF_WEBHOOK_URL:-}" ]; then
        set +x
        printf '%s' "$FEISHU_HANDOFF_WEBHOOK_URL" | $SSH "$PROD_HOST" "sudo -n python3 '$PROD_DIR/deploy/update-feishu-webhook.py' --verify"
      fi
      if [ -n "${DASHSCOPE_API_KEY_FILE:-}" ]; then
        set +x
        cat "$DASHSCOPE_API_KEY_FILE" | $SSH "$PROD_HOST" "sudo -n python3 '$PROD_DIR/deploy/update-model-key.py' --verify"
      fi
      if [ -n "${PLATFORM_SHARED_SECRET:-}" ]; then
        set +x
        printf '%s' "$PLATFORM_SHARED_SECRET" | $SSH "$PROD_HOST" "sudo -n python3 '$PROD_DIR/deploy/update-platform-config.py' --verify"
      fi
      health_body="$(curl -fsS --retry 6 --retry-delay 5 --max-time 15 https://sales-agent.hzwohu.com/health)"
      printf 'health=%s\n' "$health_body"
      login_status="$(curl -sS --max-time 15 --output /dev/null --write-out '%{http_code}' https://sales-agent.hzwohu.com/api/gate/login)"
      if [ "$login_status" != '302' ]; then
        echo "ERROR: production login configuration check failed (HTTP $login_status)"
        exit 1
      fi
      html="$(curl -fsS --retry 6 --retry-delay 5 --max-time 15 "https://sales-agent.hzwohu.com/workbench?ci=$CI_COMMIT_SHA")"
      asset="$(printf '%s' "$html" | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -n 1)"
      if [ -z "$asset" ]; then
        echo 'ERROR: production frontend asset was not found'
        exit 1
      fi
      if [ "$asset" = 'assets/index-BF6zTPMM.js' ]; then
        echo 'ERROR: production is still serving the old frontend asset'
        exit 1
      fi
      printf 'production_revision=%s frontend_asset=%s\n' "$deployed_revision" "$asset"
      if [ -n "${WECHAT_VERIFY_MATERIAL_IDS:-}" ]; then
        case "$WECHAT_VERIFY_MATERIAL_IDS" in *[!0-9,]*) echo 'Invalid material IDs'; exit 1;; esac
        case "${WECHAT_VERIFY_W_ID:-}" in ''|*[!a-zA-Z0-9-]*) echo 'Invalid online wId'; exit 1;; esac
        $SSH "$PROD_HOST" "
          set -eu
          container_id=\$(sudo -n docker ps --filter label=com.docker.compose.project=intelligent-customer-service --filter label=com.docker.compose.service=api --format '{{.ID}}')
          test -n \"\$container_id\"
          sudo -n docker exec -i \"\$container_id\" python - '$WECHAT_VERIFY_W_ID' '$WECHAT_VERIFY_MATERIAL_IDS'
        " < deploy/verify-wechat-materials.py
      fi

cos:inventory:production:
  stage: inventory
  needs:
    - verify:production
  resource_group: sales-agent-production
  timeout: 10m
  environment:
    name: production
    action: access
  script:
    - |
      set -eu
      SSH="ssh $SSHOPT"
      $SSH "$PROD_HOST" "cd '$PROD_DIR' && flock -w 1200 /tmp/intelligent-customer-service-deploy.lock bash deploy/cos-files.sh inventory '$CI_COMMIT_SHA'" > cos-inventory.json
      python3 -c 'import json; r=json.load(open("cos-inventory.json")); print("COS_INVENTORY_SUMMARY="+json.dumps({"inventory_sha256":r["inventory_sha256"],"summary":r["inventory"]["summary"],"skipped_symlinks":r["inventory"]["skipped_symlinks"]},separators=(",",":")))'
  artifacts:
    access: developer
    expire_in: 7 days
    paths:
      - cos-inventory.json

cos:upload:production:
  stage: upload
  needs:
    - job: cos:inventory:production
      artifacts: false
  resource_group: sales-agent-production
  interruptible: false
  when: manual
  allow_failure: true
  timeout: 45m
  environment:
    name: production
    action: access
  script:
    - |
      set -eu
      set +x
      if [ "${CI_DEBUG_TRACE:-false}" = 'true' ] || [ "${CI_DEBUG_SERVICES:-false}" = 'true' ]; then
        echo 'ERROR: debug logging must be disabled for COS operations'
        exit 1
      fi
      : "${COS_INVENTORY_SHA256:?Select a reviewed inventory digest}"
      : "${COS_APPROVED_FILE_IDS:?Supply a JSON array of reviewed file IDs}"
      if [ "${COS_CONFIRM_PUBLIC:-}" != 'yes' ]; then
        echo 'ERROR: set COS_CONFIRM_PUBLIC=yes only for files approved for public CDN access'
        exit 1
      fi
      SSH="ssh $SSHOPT"
      python3 -c 'import json,os,sys; json.dump({"inventory_sha256":os.environ["COS_INVENTORY_SHA256"],"file_ids":json.loads(os.environ["COS_APPROVED_FILE_IDS"]),"confirm_public":True},sys.stdout)' |
        $SSH "$PROD_HOST" "cd '$PROD_DIR' && flock -w 1200 /tmp/intelligent-customer-service-deploy.lock bash deploy/cos-files.sh upload '$CI_COMMIT_SHA'" > cos-upload.json
      python3 -c 'import json; r=json.load(open("cos-upload.json")); print("COS_UPLOAD_VERIFIED="+json.dumps({"files":len(r["verified"]),"bytes":sum(x["bytes"] for x in r["verified"])},separators=(",",":")))'
  artifacts:
    access: developer
    expire_in: 7 days
    paths:
      - cos-upload.json
