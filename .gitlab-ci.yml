# sales-agent.hzwohu.com production release
# Shared Runner: #4 hz-build-01 (tag: linux)
# Route: Runner -> ubuntu@150.158.52.233 (restricted jump) -> ubuntu@43.143.83.26

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - preflight
  - deploy
  - verify

default:
  tags:
    - linux
  interruptible: true
  before_script:
    - |
      set -eu
      install -d -m 0700 "$HOME/.ssh"
      touch "$HOME/.ssh/known_hosts"
      chmod 0600 "$HOME/.ssh/known_hosts"
      grep -Fqx '150.158.52.233 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBCmc8G53u/r3Is/WrbPwsPzAKRIQFpGEJ5XhqsImAEo' "$HOME/.ssh/known_hosts" ||
        printf '%s\n' '150.158.52.233 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBCmc8G53u/r3Is/WrbPwsPzAKRIQFpGEJ5XhqsImAEo' >> "$HOME/.ssh/known_hosts"
      grep -Fqx '43.143.83.26 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPsigB8y7BrHM2VExN9gEVm07/GspHOxXKAw7uXo4VqC' "$HOME/.ssh/known_hosts" ||
        printf '%s\n' '43.143.83.26 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPsigB8y7BrHM2VExN9gEVm07/GspHOxXKAw7uXo4VqC' >> "$HOME/.ssh/known_hosts"

variables:
  GIT_DEPTH: "20"
  PROD_HOST: "ubuntu@43.143.83.26"
  PROD_DIR: "/home/ubuntu/intelligent-customer-service"
  SSHOPT: "-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ProxyJump=ubuntu@150.158.52.233"

preflight:production:
  stage: preflight
  timeout: 5m
  script:
    - |
      set -eu
      SSH="ssh $SSHOPT"
      $SSH "$PROD_HOST" "
        set -eu
        public_ip=\$(curl -fsS --max-time 5 http://metadata.tencentyun.com/latest/meta-data/public-ipv4 || true)
        if [ \"\$public_ip\" != '43.143.83.26' ]; then
          echo \"ERROR: VPC target identity mismatch (public IP: \${public_ip:-unavailable})\"
          exit 1
        fi
        test -d '$PROD_DIR/.git'
        cd '$PROD_DIR'
        remote_url=\$(git remote get-url origin)
        case \"\$remote_url\" in
          https://git.hzwohu.com/wohu-apps/intelligent-customer-service.git|git@git.hzwohu.com:wohu-apps/intelligent-customer-service.git|ssh://git@gitlab-ics/wohu-apps/intelligent-customer-service.git)
            ;;
          *)
            echo 'ERROR: production origin is not the GitLab main repository'
            exit 1
            ;;
        esac
        if [ -n \"\$(git status --porcelain --untracked-files=no)\" ]; then
          echo 'ERROR: production checkout contains tracked changes'
          exit 1
        fi
        test -f /etc/intelligent-customer-service/backend.env
        test -d /srv/intelligent-customer-service/data
        test -d /srv/intelligent-customer-service/cache/huggingface
        test -f deploy/auto-deploy.sh
        git fetch origin main --quiet
        target_revision=\$(git rev-parse origin/main)
        if [ \"\$target_revision\" != '$CI_COMMIT_SHA' ]; then
          echo 'ERROR: production origin/main does not match this pipeline revision'
          exit 1
        fi
        sudo -n docker compose version >/dev/null
        printf 'production_host=%s target_revision=%s\\n' \"\$(hostname)\" \"\$target_revision\"
      "

deploy:production:
  stage: deploy
  needs:
    - preflight:production
  resource_group: sales-agent-production
  interruptible: false
  timeout: 45m
  environment:
    name: production
    url: https://sales-agent.hzwohu.com/workbench
  script:
    - |
      set -eu
      SSH="ssh $SSHOPT"
      if [ -n "${FEISHU_HANDOFF_WEBHOOK_URL:-}" ]; then
        set +x
        printf '%s' "$FEISHU_HANDOFF_WEBHOOK_URL" | $SSH "$PROD_HOST" "flock -w 1200 /tmp/intelligent-customer-service-deploy.lock sudo -n python3 -c \"\$(git -C '$PROD_DIR' show '$CI_COMMIT_SHA:deploy/update-feishu-webhook.py')\""
      fi
      $SSH "$PROD_HOST" "cd '$PROD_DIR' && bash deploy/auto-deploy.sh --force"

verify:production:
  stage: verify
  needs:
    - deploy:production
  timeout: 5m
  script:
    - |
      set -eu
      SSH="ssh $SSHOPT"
      deployed_revision="$($SSH "$PROD_HOST" "git -C '$PROD_DIR' rev-parse HEAD")"
      if [ "$deployed_revision" != "$CI_COMMIT_SHA" ]; then
        echo "ERROR: deployed revision $deployed_revision does not match $CI_COMMIT_SHA"
        exit 1
      fi
      if [ -n "${FEISHU_HANDOFF_WEBHOOK_URL:-}" ]; then
        set +x
        printf '%s' "$FEISHU_HANDOFF_WEBHOOK_URL" | $SSH "$PROD_HOST" "sudo -n python3 '$PROD_DIR/deploy/update-feishu-webhook.py' --verify"
      fi
      health_body="$(curl -fsS --retry 6 --retry-delay 5 --max-time 15 https://sales-agent.hzwohu.com/health)"
      printf 'health=%s\n' "$health_body"
      html="$(curl -fsS --retry 6 --retry-delay 5 --max-time 15 "https://sales-agent.hzwohu.com/workbench?ci=$CI_COMMIT_SHA")"
      asset="$(printf '%s' "$html" | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -n 1)"
      if [ -z "$asset" ]; then
        echo 'ERROR: production frontend asset was not found'
        exit 1
      fi
      if [ "$asset" = 'assets/index-BF6zTPMM.js' ]; then
        echo 'ERROR: production is still serving the old frontend asset'
        exit 1
      fi
      printf 'production_revision=%s frontend_asset=%s\n' "$deployed_revision" "$asset"
