services:
  api:
    build:
      context: ./apps/api
    env_file:
      - ${BACKEND_ENV_FILE:-./deploy/env/backend.prod.env}
    environment:
      DATABASE_URL: sqlite:////app/data/rag.db
      CHAT_LOG_DB_URL: sqlite:////app/data/chat_logs.db
      UPLOAD_DIR: /app/data/uploads
      HF_HOME: /app/data/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      INTENT_LLM_PROVIDER: dashscope
      INTENT_LLM_MODEL: qwen3.6-flash
      INTENT_LLM_TIMEOUT_SECONDS: "5"
      INTENT_FAST_RULES_ENABLED: "true"
      INTENT_FAST_RULE_THRESHOLD: "0.85"
      INTENT_PROMPT_VERSION: v2
      INTENT_SHADOW_ENABLED: "true"
      INTENT_SHADOW_SAMPLE_PERCENT: "100"
      INTENT_SHADOW_LLM_PROVIDER: dashscope
      INTENT_SHADOW_LLM_MODEL: qwen3.7-plus
      INTENT_EXAMPLE_PREWARM_ENABLED: "true"
      INTENT_EMBEDDING_CACHE_PATH: /app/data/intent_taxonomy_embeddings.json
      PERSONA_LLM_PROVIDER: dashscope
      PERSONA_LLM_MODEL: qwen3.6-flash
      RAG_FAST_LLM_PROVIDER: dashscope
      RAG_FAST_LLM_MODEL: qwen3.6-flash
      REPLY_MODEL_ROUTER_ENABLED: "true"
      EYUN_REPLY_JITTER_MIN_SECONDS: "0"
      EYUN_REPLY_JITTER_MAX_SECONDS: "2"
    expose:
      - "8000"
    volumes:
      - ${APP_DATA_DIR:-/srv/intelligent-customer-service/data}:/app/data
      - ${HF_CACHE_DIR:-/srv/intelligent-customer-service/cache/huggingface}:/app/data/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  admin-web:
    build:
      context: ./apps/admin
    env_file:
      - ${BACKEND_ENV_FILE:-./deploy/env/backend.prod.env}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./apps/admin/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    restart: unless-stopped
