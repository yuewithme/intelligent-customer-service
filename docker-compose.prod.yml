services:
  api:
    build:
      context: ./wechat_rag_bot
    env_file:
      - ./deploy/env/backend.prod.env
    environment:
      DATABASE_URL: sqlite:////app/data/rag.db
      CHAT_LOG_ENABLED: "true"
      INTENT_LLM_ENABLED: "true"
      INTENT_OBSERVATION_ENABLED: "true"
      INTENT_AUTO_CONFIRM_THRESHOLD: "0.75"
      CHAT_LOG_PROVIDER: sqlite
      CHAT_LOG_DB_URL: sqlite:////app/data/chat_logs.db
      UPLOAD_DIR: /app/data/uploads
      APP_PUBLIC_BASE_URL: http://150.158.52.233
      HF_HOME: /app/data/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    expose:
      - "8000"
    volumes:
      - ./runtime-data:/app/data
    restart: unless-stopped

  admin-web:
    build:
      context: ./admin-web
    env_file:
      - ./deploy/env/backend.prod.env
    depends_on:
      - api
    ports:
      - "80:80"
      - "21873:80"
    volumes:
      - ./admin-web/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    restart: unless-stopped
